    <radialGradient id="glow"><stop stop-color="#6b468e" stop-opacity=".35"/><stop offset="1" stop-color="#6b468e" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x2=".8" y2="1"><stop stop-color="#e6d6ff"/><stop offset="1" stop-color="#b898ec"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="438" rx="32" fill="url(#bg)" stroke="#34293f" stroke-width="2"/>
  <ellipse cx="1000" cy="220" rx="278" ry="214" fill="url(#glow)"/>
  <g fill="none" stroke="#bda0ef" stroke-opacity=".11"><circle cx="1004" cy="215" r="165"/><circle cx="1004" cy="215" r="198"/></g>
