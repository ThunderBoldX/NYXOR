name: NYXOR
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: 2.5.0
    CURRENT_PROJECT_VERSION: 1
    HEADER_SEARCH_PATHS: '$(inherited) $(BUILT_PRODUCTS_DIR)/Python.framework/Headers'
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
targets:
  NYXOR:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/frontend
        type: folder
      - path: Resources/core
        type: folder
      - path: Resources/vendor
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thunderboldx.nyxor
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
    dependencies:
      - sdk: BackgroundTasks.framework
      - framework: Support/Python.xcframework
        embed: true
    postBuildScripts:
      - name: Embed Python standard library
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -e
          source "$PROJECT_DIR/Support/Python.xcframework/build/utils.sh"
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          export EXPANDED_CODE_SIGN_IDENTITY_NAME="${EXPANDED_CODE_SIGN_IDENTITY_NAME:-Ad hoc}"
          install_python Support/Python.xcframework
schemes:
  NYXOR:
    build:
      targets:
        NYXOR: all
