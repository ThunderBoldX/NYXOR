  <g fill="#c3a6f5"><circle cx="1189" cy="112" r="2"/><circle cx="914" cy="380" r="2"/><circle cx="776" cy="226" r="2"/></g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="76" y="100" fill="#b6ebd5" font-size="15" letter-spacing="4">YOUR NIGHT SHIFT</text>
    <text x="70" y="205" fill="#f4effb" font-size="96" font-weight="700" letter-spacing="4">NYXOR</text>
    <text x="76" y="259" fill="#c3a6f5" font-size="32">grinds while you sleep.</text>
